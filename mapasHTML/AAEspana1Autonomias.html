<!DOCTYPE html
   PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Toda Argentina</title>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta http-equiv="content-language" content="es" />
    </head>

    <script src="https://code.jquery.com/jquery-3.5.1.js" integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc=" crossorigin="anonymous"></script>

    <body>
        <!-- Contenedor donde se insertará el SVG -->
        <div id="contenedor-svg"></div>

    <script>
        fetch("../svg/EspanaPais.svg")
            .then(r => r.text())
            .then(svg => {
                document.getElementById("contenedor-svg").innerHTML = svg;

                const nodos = document.querySelectorAll("[onclick]");

                nodos.forEach(n => {
                    let code = n.getAttribute("onclick");

                    // Si el onclick apunta a un archivo .svg sin path
                    if (code.includes(".svg") && !code.includes("/")) {

                        const archivo = code.match(/'(.*?)'/)[1];

                        // Sacar el .svg → dejar solo el nombre base
                        const base = archivo.replace(".svg", "");

                        // Reemplazar por la ruta correcta → mapasHTML/<archivo>.html
                        const nuevo = code.replace(
                            archivo, base + ".html"
                        );

                        n.setAttribute("onclick", nuevo);
                    }
                });

                inicializarRegiones();
            });
        
            function inicializarRegiones() {
                var test = document.querySelectorAll(".region");

                for (var i = 0; i < test.length; i++) {
                    console.log("Test: " + test[i]);

                    test[i].addEventListener("click", function() {
                        var region = this;
                        var nombreRegion = region.getAttribute('inkscape:label');

                        var parametros = { region: nombreRegion };

                        $.ajax({
                            async: false,
                            url: 'SVG_Regiones_AJAX.php',
                            data: parametros,
                            beforeSend: function(objeto) {},
                            success: function(data) {
                                enviarDato(data);
                            }
                        });
                    });
                }
            }

            function enviarDato(region) {
                var datoParaEnviar = "ubic_region_id;" + region;
                window.parent.postMessage(datoParaEnviar, window.location.origin);
            }
    </script>

    </body>
</html>
