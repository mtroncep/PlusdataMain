<!DOCTYPE html
   PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Toda Argentina</title>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta http-equiv="content-language" content="es" />
    </head>

    <script src="https://code.jquery.com/jquery-3.5.1.js" integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc=" crossorigin="anonymous"></script>

    <body>
        <!-- Contenedor donde se insertará el SVG -->
        <div id="contenedor-svg"></div>

    <script>
fetch("../svg/UruguayMontevideoMunicipios.svg")
    .then(r => r.text())
    .then(svg => {
        document.getElementById("contenedor-svg").innerHTML = svg;

        // Esperar a que el SVG esté parseado
        requestAnimationFrame(() => {

            // ---------------------------------------------------------
            // 1) DETECTAR MUNICIPIO FIJO
            // ---------------------------------------------------------
            const nodoMunicipioFijo = document.querySelector(".municipio");

            if (nodoMunicipioFijo) {

                let nombreComarca = "Comarca Única";
                $.ajax({
                    async: false,
                    url: 'SVG_Comarcas_AJAX.php',
                    data: { comarca: nombreComarca },
                    success: function(data) {
                        console.log("***Comarca única*** " + data);
                        enviarDatoComarca(data);
                    }
                });
                
                const nodoMunicipioFijo = document.querySelector(".municipio");
                const nombreMunicipio = nodoMunicipioFijo.getAttribute("inkscape:label");
                console.log("Municipio fijo:", nombreMunicipio);
                $.ajax({
                    async: false,
                    url: 'SVG_Municipios_AJAX.php',
                    data: { municipio: nombreMunicipio },
                    success: function(data) {
                        console.log("***Ciudad de Montevideo*** " + data);
                        enviarDatoMunicipio(data);
                    }
                });
                
              }

            // ---------------------------------------------------------
            // 2) PROCESAR LOCALIDADES
            // ---------------------------------------------------------
            const nodos = document.querySelectorAll(".localidad");
            let hayOnclicks = false;

            nodos.forEach(n => {
                let code = n.getAttribute("onclick");

                const onclickReal = code && code.includes(".svg");

                if (!onclickReal) {
                    n.addEventListener("click", function (e) {
                        e.stopPropagation();
                        const nombreLocalidad = this.getAttribute("inkscape:label");
                        console.log("Localidad (final): " + nombreLocalidad);

                        $.ajax({
                            async: false,
                            url: 'SVG_Localidades_AJAX.php',
                            data: { localidad: nombreLocalidad },
                            success: function(data) {
                                enviarDatoLocalidad(data);
                            }
                        });
                    });
                }

                if (onclickReal) {
                    hayOnclicks = true;

                    const archivo = code.match(/'(.*?)'/)[1];
                    const base = archivo.replace(".svg", "");
                    const nuevo = code.replace(archivo, base + ".html");
                    n.setAttribute("onclick", nuevo);
                }
            });

            if (hayOnclicks) {
                inicializarLocalidades();
            }

        }); // requestAnimationFrame
    }); // fetch


// ---------------------------------------------------------
// 3) Inicializar localidades navegables
// ---------------------------------------------------------
function inicializarLocalidades() {
    var test = document.querySelectorAll(".localidad");

    for (var i = 0; i < test.length; i++) {

        let code = test[i].getAttribute("onclick");
        if (!code || !code.includes(".svg")) continue;

        test[i].addEventListener("click", function(e) {
            e.stopPropagation();
            var nombreLocalidad = this.getAttribute('inkscape:label');
            console.log("Localidad: " + nombreLocalidad);

            $.ajax({
                async: false,
                url: 'SVG_Localidades_AJAX.php',
                data: { localidad: nombreLocalidad },
                success: function(data) {
                    enviarDatoLocalidad(data);
                }
            });
        });
    }
}


// ---------------------------------------------------------
// 4) Enviar datos al padre
// ---------------------------------------------------------
function enviarDatoMunicipio(region) {
    var datoParaEnviar = "ubic_municipio_id;" + region;
//    window.parent.postMessage(datoParaEnviar, window.location.origin);
    window.parent.postMessage(datoParaEnviar, "*");
}

function enviarDatoComarca(codigo) {
    var datoParaEnviar = "ubic_comarca_id;" + codigo;
    window.parent.postMessage(datoParaEnviar, "*");
}

function enviarDatoLocalidad(codigo) {
    var datoParaEnviar = "ubic_localidad_id;" + codigo;
    window.parent.postMessage(datoParaEnviar, "*");
}
    </script>
  </body>
</html>
