<!DOCTYPE html
   PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Toda Argentina</title>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta http-equiv="content-language" content="es" />
    </head>

    <script src="https://code.jquery.com/jquery-3.5.1.js" integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc=" crossorigin="anonymous"></script>

    <body>
        <!-- Contenedor donde se insertará el SVG -->
        <div id="contenedor-svg"></div>

    <script>
        fetch("../svg/ArgentinaBuenosAiresCapitalFederal.svg")
            .then(r => r.text())
            .then(svg => {
                document.getElementById("contenedor-svg").innerHTML = svg;

                // 🔥 LIMPIAR ONCLICKs FANTASMA
                document.querySelectorAll("g, path, rect, polygon").forEach(el => {
                    const code = el.getAttribute("onclick");
                    if (code && !el.classList.contains("comarca") && !el.classList.contains("localidad")) {
                        el.setAttribute("onclick", "");
                    }
                });

                // 🔥 PROCESAR ONCLICKs REALES (renombrar .svg → .html)
                const nodos = document.querySelectorAll("[onclick]");
                let hayOnclicks = false;

                nodos.forEach(n => {
                    let code = n.getAttribute("onclick");
                    const onclickReal = code && code.includes(".svg");

                    if (!onclickReal) return;

                    hayOnclicks = true;

                    const archivo = code.match(/'(.*?)'/)[1];
                    const base = archivo.replace(".svg", "");
                    const nuevo = code.replace(archivo, base + ".html");
                    n.setAttribute("onclick", nuevo);
                });

                // 🔥 PROVINCIA AUTOMÁTICA
                var el = document.getElementById("Capital Federal");
                var estaCompleto = el ? el.getAttribute('inkscape:label') : null;

                if (estaCompleto !== null){
                    $.ajax({
                      async: false,
                      url: 'SVG_Provincias_AJAX.php',
                      data: { provincia: estaCompleto },
                      success: function(data) {
                          enviarDatoProvincia(data);
                      }
                    });
                }

                // 🔥 COMARCAS
                var test = document.querySelectorAll('.comarca');
                for(var i=0;i<test.length;i++)
                {
                    test[i].addEventListener("click", function(e)
                    {
                       e.stopPropagation();
                       var nombreComarca = this.getAttribute('inkscape:label');

                       $.ajax({
                          async: false,
                          url: 'SVG_Comarcas_AJAX.php',
                          data: { comarca: nombreComarca },
                          success: function(data) {
                              enviarDato(data);
                          }
                       });
                    }); 
                }

                // 🔥 SOLO SI EL MAPA NAVEGA
                if (hayOnclicks) inicializarRegiones();
            });

        function inicializarRegiones() {
            var test = document.querySelectorAll(".localidad");

            for (var i = 0; i < test.length; i++) {

                let code = test[i].getAttribute("onclick");
                if (!code || !code.includes(".svg")) continue;

                test[i].addEventListener("click", function(e) {
                    e.stopPropagation();
                    var nombreRegion = this.getAttribute('inkscape:label');

                    $.ajax({
                        async: false,
                        url: 'SVG_Localidades_AJAX.php',
                        data: { localidad: nombreRegion },
                        success: function(data) {
                            enviarDato(data);
                        }
                    });
                });
            }
        }

        function enviarDato(comarca) {
            window.parent.postMessage("ubic_comarca_id;" + comarca, window.location.origin);
        }

        function enviarDatoProvincia(region) {
            window.parent.postMessage("ubic_provincia_id;" + region, window.location.origin);
        }
    </script>

    </body>
</html>
