                      "comarca": nombreComarca
                   };
                   $.ajax({
                      async: false,
                      url: 'SVG_Comarcas_AJAX.php',
                      data: parametros,
                      beforeSend: function(objeto) {},
                      success: function(data) {
                      enviarDato(data);
                      }
                   })
                }); 
             }
          }

         function enviarDato(comarca) { // Datos que quieres enviar, por ejemplo, el valor para el select 
            var datoParaEnviar = "ubic_comarca_id;"+comarca; // Envía el dato al padre 
            window.parent.postMessage(datoParaEnviar, window.location.origin); 
            }
</script>
