         async function hacerSolicitud(url, params, posSelect) {
            try {
                const response = await fetch(url + '?' + new URLSearchParams(params));
                if (!response.ok) {
                    throw new Error('Error en la solicitud: ' + response.statusText);
                }
                const valorObtenido = await response.text();
                var datoParaEnviarProv = posSelect + ";" + valorObtenido; // Envía el dato al padre
                console.log("Envio a dominio principal: "+datoParaEnviarProv);
                window.parent.postMessage(datoParaEnviarProv, window.location.origin);
                return valorObtenido;
            } catch (error) {
                console.error('Error en hacerSolicitud:', error);
            }
        }
