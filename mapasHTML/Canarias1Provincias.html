 window.onload = function () 
  { var test =document.querySelectorAll('.provincia');

		{ var provincia = document.getElementById(this.id);
                  var nombreProvincia = provincia.getAttribute('inkscape:label');

		   var parametros = {

			  async: false,
			  url: 'SVG_Provincias_AJAX.php',

			  beforeSend: function(objeto) {},
			  success: function(data) {
			  enviarDato(data);
			  }
		   })
		}); 
	 }
  }

 function enviarDato(region) { 
	var datoParaEnviar = "ubic_provincia_id;"+region; // Envía el dato al padre 
	window.parent.postMessage(datoParaEnviar, window.location.origin); 
	}
