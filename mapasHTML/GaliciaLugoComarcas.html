</div>
<script>
         window.onload = function () 
          {
            var test =document.querySelectorAll('.comarca');
            for(var i=0;i<test.length;i++)
             {
                test[i].addEventListener("click", function()
                {
                   var comarca = document.getElementById(this.id);
                   var nombreComarca = comarca.getAttribute('inkscape:label');
//                   var nombreComarca = comarca.getElementsByTagName('title')[0].textContent;
                   //alert("Comarca: "+nombreComarca);

                   var parametros = {
                      "comarca": nombreComarca
                   };
                   $.ajax({
                      async: false,
                      url: 'SVG_Comarcas_AJAX.php',
                      data: parametros,
                      beforeSend: function(objeto) {},
                      success: function(data) {
                      enviarDato(data);
                      }
                   })
                }); 
             }
          }

         function enviarDato(comarca) { // Datos que quieres enviar, por ejemplo, el valor para el select 
            var datoParaEnviar = "ubic_comarca_id;"+comarca; // Envía el dato al padre 
            window.parent.postMessage(datoParaEnviar, window.location.origin); 
            }
</script>
