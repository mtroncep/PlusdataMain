    <script>
       window.onload = function () 
          {
             var test =document.querySelectorAll('.provincia')
             for(var i=0;i<test.length;i++)
             {
                test[i].addEventListener("click", function()
                {
                   var provincia = document.getElementById(this.id);
                   var nombreProvincia = provincia.getAttribute('title');

                   var parametros = {
                      "provincia": nombreProvincia
                   };
                   $.ajax({
                      url: 'SVG_Provincias_AJAX.php',
                      data: parametros,
                      beforeSend: function(objeto) {},
                      success: function(data) {
                         alert(data);
                         $(".outer_div_01").html(data).fadeIn('slow');
                      }
                   })

                   alert("El id del boton es "+this.id+" Nombre "+nombreProvincia);
                }); 
             }
          } 

   </script>
