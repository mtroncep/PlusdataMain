<svg preserveAspectRatio="xMidYMid meet" viewBox="0 0 610 675" id="Región 23" class="comarca" inkscape:label="Región 23" sodipodi:docname="ArgentinaPampeanaProvinciaBuenosAiresR23.svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
<style id="mapas.css"><![CDATA[
svg {
  width: 100%;
  height: auto;
  max-width: 800px;
}
svg[viewBox="0 0 610 675"] { max-width: 610px; }

/* Zonas */
.zonas, .zonaroja, .zonagris, .zonaverde {
  cursor: pointer;
  stroke: #000;
  stroke-width: 0.30;
}
.zonas      { fill: #f8f593; }
.zonaroja   { fill: red; }
.zonagris   { fill: #c5bfc4; }
.zonaverde  { fill: #319e4d; }

/* Path: crecer y cambiar de color (CSS puro o con script) */
.zonas {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform .2s ease, fill .2s ease;
}
.zonas:hover,
.zonas.hover {
  transform: scale(1.25);
  fill: #ffd700;
}

/* Textos: tamaño normal y tamaño en hover (--h) */
.textos21, .textos14, .textos10, .textos9, .textos8 {
  font-family: Montserrat, sans-serif;
  text-align: center;
  text-anchor: middle;
}
.textos21 { font-size: 21px; --h: 24px; }
.textos14 { font-size: 14px; --h: 17px; }
.textos10 { font-size: 10px; --h: 13px; }
.textos9  { font-size: 9px;  --h: 12px; }
.textos8  { font-size: 8px;  --h: 11px; }

/* Tooltip siempre visible */
.tooltip {
  opacity: 1;
  pointer-events: none;
  fill: #000;
  transition: font-size .25s ease;
}

/* Rectángulos */
.rectangulos {
  fill: white;
  stroke: black;
  stroke-width: 0.3;
  transform-box: fill-box;
  transform-origin: center;
  transition: transform .25s ease;
}

/* Flechas */
.flechas {
  fill: black;
  fill-opacity: 1;
  fill-rule: evenodd;
  stroke: black;
  stroke-width: 1;
  transform-box: fill-box;
  transform-origin: center;
  transition: transform .25s ease;
}

/* Lineas */
.lineas {
  fill: none;
  fill-rule: evenodd;
  stroke: black;
}

/* Rect y flecha que además son .tooltip: recuperar su color y su transición */
.rectangulos.tooltip { fill: white; transition: transform .25s ease; }
.flechas.tooltip     { fill: black; transition: transform .25s ease; }

/* Rect y flecha crecen en hover */
.zonas:hover + .rectangulos,
.zonas:hover + .flechas,
.zonas:hover + .rectangulos + .flechas,
.zonas:hover + .flechas + .rectangulos,
.zonas.hover + .rectangulos,
.zonas.hover + .flechas {
  transform: scale(1.15);
}

.rectangulos.hover,
.flechas.hover {
  transform: scale(1.15);
}

/* Texto en hover: hasta 5 elementos .tooltip seguidos tras el path */
.zonas:hover + .tooltip,
.zonas:hover + .tooltip + .tooltip,
.zonas:hover + .tooltip + .tooltip + .tooltip,
.zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip,
.zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
.zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
.zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
.zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
.zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
.tooltip.hover {
  font-size: var(--h);
}

/* Móvil */
@media (max-width: 500px) {
  .textos21 { font-size: 32px !important; --h: 37px; }
  .textos14 { font-size: 24px !important; --h: 28px; }
  .textos10 { font-size: 18px !important; --h: 21px; }
  .textos9  { font-size: 16px !important; --h: 19px; }
  .textos8  { font-size: 14px !important; --h: 17px; }

  .textos8, .textos9, .textos10, .textos14, .textos21 {
    dominant-baseline: central;
    alignment-baseline: middle;
  }

  .zonas, .zonaroja, .zonagris, .zonaverde {
    stroke-width: 0.80 !important;
  }

  .rectangulos.tooltip {
    transform: scale(1.7, 1.8) !important;
    transform-box: fill-box;
    transform-origin: center;
  }

  /* El hover debe llevar !important para ganar a los tamaños de arriba */
  .zonas:hover + .tooltip,
  .zonas:hover + .tooltip + .tooltip,
  .zonas:hover + .tooltip + .tooltip + .tooltip,
  .zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip,
  .zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
  .zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
  .zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
  .zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
  .zonas:hover + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip + .tooltip,
  .tooltip.hover {
    font-size: var(--h) !important;
  }

  .zonas:hover + .rectangulos,
  .zonas:hover + .flechas + .rectangulos {
    transform: scale(1.95, 2.05) !important;
  }

  .rectangulos.hover {
    transform: scale(1.95, 2.05) !important;
  }
}
]]></style>
